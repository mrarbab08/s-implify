<svg xmlns="http://www.w3.org/2000/svg" width="420" height="340" viewBox="0 0 420 340" role="img" aria-label="Student working at a desk and waving">
  <!-- ground shadow -->
  <ellipse cx="214" cy="306" rx="130" ry="12" fill="#0f3a34" opacity="0.22" />

  <!-- excitement sparkles above monitor -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.95">
    <line x1="176" y1="96" x2="170" y2="82" />
    <line x1="192" y1="92" x2="192" y2="78" />
    <line x1="208" y1="96" x2="214" y2="82" />
  </g>

  <!-- monitor -->
  <rect x="128" y="118" width="86" height="60" rx="8" fill="#20404C" />
  <rect x="136" y="126" width="70" height="44" rx="4" fill="#33596A" />
  <rect x="164" y="178" width="14" height="18" fill="#1A323B" />
  <rect x="146" y="194" width="50" height="10" rx="5" fill="#1A323B" />
  <!-- sticky note on monitor -->
  <rect x="188" y="128" width="18" height="18" rx="2" fill="#F4F7F8" transform="rotate(6 197 137)" />

  <!-- laptop (open, angled) -->
  <g transform="rotate(-8 290 196)">
    <path d="M282 150 L316 156 L306 196 L276 190 Z" fill="#1A323B" />
    <rect x="266" y="190" width="52" height="9" rx="4.5" fill="#F4F7F8" />
  </g>

  <!-- character -->
  <!-- waving arm -->
  <path d="M236 186 C252 170 258 148 260 128" stroke="#F6CDA4" stroke-width="15" fill="none" stroke-linecap="round" />
  <!-- spread fingers -->
  <g stroke="#F6CDA4" stroke-width="5" stroke-linecap="round">
    <line x1="255" y1="124" x2="249" y2="111" />
    <line x1="261" y1="122" x2="260" y2="107" />
    <line x1="266" y1="126" x2="272" y2="114" />
  </g>
  <!-- head -->
  <circle cx="208" cy="158" r="30" fill="#F6CDA4" />
  <!-- ears -->
  <circle cx="180" cy="160" r="7" fill="#F6CDA4" />
  <circle cx="236" cy="160" r="7" fill="#F6CDA4" />
  <!-- hair fringe -->
  <path d="M182 152 C186 132 198 124 208 124 C222 124 232 132 236 152 C228 146 190 146 182 152 Z" fill="#5B3A2A" />
  <!-- hat -->
  <ellipse cx="208" cy="126" rx="34" ry="10" fill="#C9976B" />
  <path d="M182 124 C182 106 194 96 208 96 C222 96 234 106 234 124 Z" fill="#B98A5C" />
  <ellipse cx="208" cy="94" rx="5" ry="4" fill="#A87A4E" />
  <!-- face -->
  <circle cx="198" cy="160" r="4" fill="#33272B" />
  <circle cx="218" cy="160" r="4" fill="#33272B" />
  <path d="M200 172 Q208 178 216 172" stroke="#8A5A3B" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <!-- blush -->
  <circle cx="188" cy="168" r="4" fill="#F5A9A9" opacity="0.7" />
  <circle cx="228" cy="168" r="4" fill="#F5A9A9" opacity="0.7" />
  <!-- torso (white tee, hidden partly behind desk) -->
  <path d="M182 212 C182 192 194 184 208 184 C222 184 234 192 234 212 Z" fill="#F4F7F8" />
  <!-- desk-side arm resting on desk -->
  <path d="M186 196 C178 200 172 204 168 208" stroke="#F6CDA4" stroke-width="13" fill="none" stroke-linecap="round" />

  <!-- desk -->
  <rect x="88" y="212" width="252" height="12" rx="6" fill="#F4F7F8" />
  <!-- legs -->
  <rect x="104" y="224" width="10" height="66" rx="5" fill="#F4F7F8" />
  <rect x="314" y="224" width="10" height="66" rx="5" fill="#F4F7F8" />
  <ellipse cx="109" cy="294" rx="14" ry="6" fill="#F4F7F8" />
  <ellipse cx="319" cy="294" rx="14" ry="6" fill="#F4F7F8" />

  <!-- rolling stool below desk -->
  <rect x="204" y="240" width="10" height="40" rx="5" fill="#1A323B" />
  <path d="M190 292 Q209 282 228 292" stroke="#1A323B" stroke-width="7" fill="none" stroke-linecap="round" />
  <circle cx="188" cy="296" r="6" fill="#1A323B" />
  <circle cx="230" cy="296" r="6" fill="#1A323B" />

  <!-- splayed legs -->
  <path d="M196 224 C186 234 176 240 170 244" stroke="#12655B" stroke-width="16" fill="none" stroke-linecap="round" />
  <path d="M222 224 C232 234 242 240 248 244" stroke="#12655B" stroke-width="16" fill="none" stroke-linecap="round" />
  <!-- sneakers -->
  <ellipse cx="168" cy="250" rx="13" ry="8" fill="#FFFFFF" transform="rotate(-16 168 250)" />
  <ellipse cx="250" cy="250" rx="13" ry="8" fill="#FFFFFF" transform="rotate(16 250 250)" />

  <!-- potted plant -->
  <g>
    <ellipse cx="62" cy="270" rx="9" ry="16" fill="#3BB49A" transform="rotate(-18 62 270)" />
    <ellipse cx="70" cy="258" rx="7" ry="13" fill="#7FD4BF" />
    <path d="M50 284 L84 284 L78 308 L56 308 Z" fill="#E76F51" />
    <rect x="50" y="280" width="34" height="7" rx="3.5" fill="#D65A3F" transform="rotate(180 67 283.5)" />
  </g>
  <!-- small ticket on desk -->
  <rect x="150" y="206" width="12" height="16" rx="2" fill="#FFFFFF" transform="rotate(14 156 214)" />
</svg>
