<div class="relative min-h-screen">
  <!-- Real photo background -->
  <div class="absolute inset-0">
    <img
      src="/assets/images/auth/signup-background.jpg"
      alt=""
      class="h-full w-full object-cover"
    />
  </div>

  <!-- Language selector (page level, functional) -->
  <div class="absolute end-6 top-6 z-10" *ngIf="store?.languageList">
    <div class="dropdown">
      <div hlMenu>
        <button
          type="button"
          hlMenuButton
          class="flex items-center gap-2.5 rounded-full border border-black/10 bg-white/90 px-3 py-1.5 text-[#12213b] shadow-sm backdrop-blur transition hover:border-primary hover:text-primary"
        >
          <img
            [src]="'/assets/images/flags/'+ store.locale.toUpperCase() + '.svg'"
            alt="image"
            class="h-5 w-5 rounded-full object-cover"
          />
          <span class="text-sm uppercase">{{ store.locale }}</span>
          <span class="shrink-0">
            <icon-caret-down />
          </span>
        </button>
        <ul
          *hlMenuItems
          animate.enter="anim-enter-toggle" animate.leave="anim-leave-toggle"
          class="top-11 grid w-[280px] grid-cols-2 gap-2 !px-2 font-semibold text-dark ltr:-right-6 rtl:-left-6 dark:text-white-dark dark:text-white-light/90"
        >
          @for (item of store.languageList; track item) {
            <li>
              <button
                *hlMenuItem="let menuItem"
                type="button"
                class="w-full hover:text-primary"
                [ngClass]="{ 'bg-primary/10 text-primary': translate.currentLang === item.code }"
                (click)="changeLanguage(item)"
              >
                <img
                  class="h-5 w-5 rounded-full object-cover"
                  [src]="'/assets/images/flags/'+ item.code.toUpperCase() + '.svg'"
                  alt=""
                />
                <span class="ltr:ml-3 rtl:mr-3">{{ item.name }}</span>
              </button>
            </li>
          }
        </ul>
      </div>
    </div>
  </div>

  <!-- Floating card on the left -->
  <div
    class="anim-fade-up relative flex min-h-screen items-center px-6 py-10 sm:px-12 lg:justify-start lg:ps-[6vw]"
  >
    <div
      class="w-full max-w-[400px] rounded-[30px] bg-white px-7 py-9 shadow-[0_30px_70px_-30px_rgba(15,23,42,0.35)] sm:px-9"
    >
      <!-- Alerts -->
      <div
        *ngIf="errorMsg"
        class="mb-4 flex items-start gap-3 rounded-xl border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a10 10 0 100 20A10 10 0 0012 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
        </svg>
        <span>{{ errorMsg }}</span>
      </div>
      <div
        *ngIf="successMsg"
        class="mb-4 flex items-start gap-3 rounded-xl border border-success/30 bg-success/10 px-4 py-3 text-sm text-success"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a10 10 0 100 20A10 10 0 0012 2zm-1 14.414L6.586 12 8 10.586l3 3 6-6L18.414 9 11 16.414z" />
        </svg>
        <span>{{ successMsg }}</span>
      </div>

      <h1 class="text-center text-2xl text-[#2A9D8F]">Sign up</h1>

      <form class="mt-7 space-y-6" (ngSubmit)="onSubmit()" #registerForm="ngForm">
        <!-- Full name -->
        <div>
          <label for="boxed-register-name" class="mb-1 block text-sm text-[#12213b]">
            Full Name
          </label>
          <input
            id="boxed-register-name"
            type="text"
            name="displayName"
            class="w-full border-0 border-b border-[#d7dce3] bg-transparent px-0 py-2 text-sm text-[#12213b] placeholder:text-[#b7bdcc] rounded-none shadow-none focus:border-[#2A9D8F] focus:ring-0"
            [(ngModel)]="displayName"
            required
            [disabled]="isLoading"
          />
        </div>

        <!-- Email -->
        <div>
          <label for="boxed-register-email" class="mb-1 block text-sm text-[#12213b]">
            Email
          </label>
          <input
            id="boxed-register-email"
            type="email"
            name="email"
            autocomplete="username"
            class="w-full border-0 border-b border-[#d7dce3] bg-transparent px-0 py-2 text-sm text-[#12213b] placeholder:text-[#b7bdcc] rounded-none shadow-none focus:border-[#2A9D8F] focus:ring-0"
            [(ngModel)]="email"
            required
            email
            [disabled]="isLoading"
          />
        </div>

        <!-- Password -->
        <div>
          <label for="boxed-register-password" class="mb-1 block text-sm text-[#12213b]">
            Password
          </label>
          <div class="relative">
            <input
              id="boxed-register-password"
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              autocomplete="new-password"
              class="w-full border-0 border-b border-[#d7dce3] bg-transparent px-0 py-2 pe-8 text-sm text-[#12213b] placeholder:text-[#b7bdcc] rounded-none shadow-none focus:border-[#2A9D8F] focus:ring-0"
              [(ngModel)]="password"
              required
              minlength="6"
              [disabled]="isLoading"
            />
            <button
              type="button"
              class="absolute end-0 top-1/2 -translate-y-1/2 text-[#b7bdcc] transition-colors hover:text-[#2A9D8F]"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12S5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.06 10.06 0 0112 20C5 20 1 12 1 12a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm password -->
        <div>
          <label for="boxed-register-confirm" class="mb-1 block text-sm text-[#12213b]">
            Confirm Password
          </label>
          <div class="relative">
            <input
              id="boxed-register-confirm"
              [type]="showConfirm ? 'text' : 'password'"
              name="confirmPassword"
              autocomplete="new-password"
              class="w-full border-0 border-b border-[#d7dce3] bg-transparent px-0 py-2 pe-8 text-sm text-[#12213b] placeholder:text-[#b7bdcc] rounded-none shadow-none focus:border-[#2A9D8F] focus:ring-0"
              [ngClass]="{ '!border-danger': confirmPassword && confirmPassword !== password }"
              [(ngModel)]="confirmPassword"
              required
              [disabled]="isLoading"
            />
            <button
              type="button"
              class="absolute end-0 top-1/2 -translate-y-1/2 text-[#b7bdcc] transition-colors hover:text-[#2A9D8F]"
              (click)="toggleConfirmPassword()"
              [attr.aria-label]="showConfirm ? 'Hide password' : 'Show password'"
            >
              <svg *ngIf="!showConfirm" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12S5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showConfirm" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.06 10.06 0 0112 20C5 20 1 12 1 12a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <p *ngIf="confirmPassword && confirmPassword !== password" class="mt-1 text-xs text-danger">
            Passwords do not match
          </p>
        </div>

        <!-- submit -->
        <button
          type="submit"
          class="flex w-full items-center justify-center gap-2 rounded-full bg-[#2A9D8F] py-3 text-sm text-white shadow-[0_12px_25px_-10px_rgba(42,157,143,0.8)] transition-all duration-200 hover:bg-[#1E7A70] active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-60"
          [disabled]="isLoading || !displayName || !email || !password || !confirmPassword || confirmPassword !== password"
        >
          <span *ngIf="!isLoading">Sign up</span>
          <span *ngIf="isLoading" class="flex items-center justify-center gap-2">
            <svg class="h-4 w-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            Creating Account…
          </span>
        </button>

        <p class="text-end text-xs text-[#5f6b7a]">
          Already have an account?
          <a routerLink="/auth/login" class="text-[#2A9D8F] transition hover:underline">Sign In</a>
        </p>
      </form>
    </div>
  </div>
</div>
