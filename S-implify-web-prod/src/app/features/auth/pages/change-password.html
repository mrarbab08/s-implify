<div class="relative min-h-screen overflow-x-hidden">
  <img
    src="/assets/images/auth/simplify-login-background.png"
    alt=""
    class="absolute inset-0 h-full w-full object-cover object-center"
  />
  <div class="absolute inset-0 bg-black/15"></div>

  <div class="relative flex min-h-screen flex-col items-center justify-center px-6 py-6 sm:px-16">
    <div
      class="mb-4 w-full max-w-[440px] shrink-0 rounded-2xl border border-white/60 bg-white/75 px-8 py-5 text-center shadow-[0_12px_40px_rgba(15,23,42,0.14)] backdrop-blur-md"
    >
      <img
        src="/assets/images/logo.jpeg"
        alt="S-iMPLify — Simplify to Amplify"
        class="mx-auto h-auto w-[180px] object-contain sm:w-[200px]"
      />
    </div>

    <div
      class="w-full max-w-[440px] shrink-0 rounded-2xl border border-white/60 bg-white/75 px-8 py-8 shadow-[0_12px_40px_rgba(15,23,42,0.14)] backdrop-blur-md sm:px-10 sm:py-9"
    >
      <div class="mb-6 text-center">
        <h1 class="text-2xl font-bold text-[#0e1726] dark:text-white-light">Change Password</h1>
        <p class="mt-1 text-sm text-[#64748b] dark:text-white-dark">
          Choose a new password using the reset link from your email
        </p>
      </div>

      <div
        *ngIf="errorMsg"
        class="mb-4 flex items-center gap-3 rounded-lg border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a10 10 0 100 20A10 10 0 0012 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
        </svg>
        <span>{{ errorMsg }}</span>
      </div>

      <div
        *ngIf="successMsg"
        class="mb-4 flex items-center gap-3 rounded-lg border border-success/30 bg-success/10 px-4 py-3 text-sm text-success"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a10 10 0 100 20A10 10 0 0012 2zm-1 14.414L6.586 12 8 10.586l3 3 6-6L18.414 9 11 16.414z" />
        </svg>
        <span>{{ successMsg }}</span>
      </div>

      <form class="space-y-4 dark:text-white" (ngSubmit)="onSubmit()">
        <div>
          <label for="reset-token" class="mb-1.5 block text-sm font-semibold text-[#334155] dark:text-white-light">
            Reset token
          </label>
          <div class="relative text-white-dark">
            <input
              id="reset-token"
              type="text"
              name="token"
              placeholder="Token from email link"
              class="form-input cursor-not-allowed border-[#e2e8f0] bg-[#f1f5f9] ps-10 placeholder:text-[#94a3b8] dark:border-[#1b2e4b] dark:bg-[#0e1726]"
              [ngModel]="token"
              disabled
              readonly
              autocomplete="off"
            />
            <span class="absolute start-4 top-1/2 -translate-y-1/2">
              <icon-mail [fill]="true" />
            </span>
          </div>
        </div>

        <div>
          <label for="new-password" class="mb-1.5 block text-sm font-semibold text-[#334155] dark:text-white-light">
            New password
          </label>
          <div class="relative text-white-dark">
            <input
              id="new-password"
              [type]="showPassword ? 'text' : 'password'"
              name="newPassword"
              placeholder="Enter new password"
              class="form-input border-[#e2e8f0] bg-white ps-10 pe-10 placeholder:text-[#94a3b8] dark:border-[#1b2e4b] dark:bg-[#0e1726]"
              [(ngModel)]="newPassword"
              required
              minlength="6"
              [disabled]="isLoading"
              autocomplete="new-password"
            />
            <span class="absolute start-4 top-1/2 -translate-y-1/2">
              <icon-lock-dots [fill]="true" />
            </span>
            <button
              type="button"
              class="absolute end-3 top-1/2 -translate-y-1/2 text-[#94a3b8] transition-colors hover:text-primary"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12S5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.06 10.06 0 0112 20C5 20 1 12 1 12a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <div>
          <label for="confirm-password" class="mb-1.5 block text-sm font-semibold text-[#334155] dark:text-white-light">
            Confirm password
          </label>
          <div class="relative text-white-dark">
            <input
              id="confirm-password"
              [type]="showConfirmPassword ? 'text' : 'password'"
              name="confirmPassword"
              placeholder="Confirm new password"
              class="form-input border-[#e2e8f0] bg-white ps-10 pe-10 placeholder:text-[#94a3b8] dark:border-[#1b2e4b] dark:bg-[#0e1726]"
              [(ngModel)]="confirmPassword"
              required
              [disabled]="isLoading"
              autocomplete="new-password"
              [ngClass]="{ 'border-danger focus:border-danger': confirmPassword && confirmPassword !== newPassword }"
            />
            <span class="absolute start-4 top-1/2 -translate-y-1/2">
              <icon-lock-dots [fill]="true" />
            </span>
            <button
              type="button"
              class="absolute end-3 top-1/2 -translate-y-1/2 text-[#94a3b8] transition-colors hover:text-primary"
              (click)="toggleConfirmPasswordVisibility()"
              [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'"
            >
              <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12S5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.06 10.06 0 0112 20C5 20 1 12 1 12a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <p *ngIf="confirmPassword && confirmPassword !== newPassword" class="mt-1 text-xs text-danger">
            Passwords do not match
          </p>
        </div>

        <button
          type="submit"
          class="btn btn-gradient !mt-5 w-full border-0 uppercase shadow-[0_10px_20px_-10px_rgba(67,97,238,0.44)]"
          [disabled]="isLoading || !token || !newPassword || !confirmPassword || confirmPassword !== newPassword"
        >
          <span *ngIf="!isLoading">Reset password</span>
          <span *ngIf="isLoading" class="flex items-center justify-center gap-2">
            <svg class="h-4 w-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            Saving…
          </span>
        </button>
      </form>

      <div class="mt-4 text-center">
        <a
          routerLink="/auth/login"
          class="text-sm font-semibold text-primary transition hover:underline"
        >
          Back to sign in
        </a>
      </div>

      <p class="mt-5 text-center text-xs dark:text-white-dark">
        © {{ currYear }} S-Implify. All Rights Reserved.
      </p>
    </div>
  </div>
</div>
