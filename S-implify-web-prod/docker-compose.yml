services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: s-implify-web-dev
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: npx ng serve --host 0.0.0.0 --port 4200 --poll 2000
