# S-Implify production nginx config.
# Serves the Angular bundle and proxies /api/* to the backend container.
# `api` is the docker-compose service name; change it if you run the API
# somewhere else (or point it at 127.0.0.1:8080 for a bare-metal backend).

upstream simplify_api {
    server api:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload endpoint accepts 50 MB spreadsheets.
    client_max_body_size 64m;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── API proxy ─────────────────────────────────────────────────────────
    # Exact paths that do not end in a slash (the SPA fallback would eat them).
    location = /api {
        proxy_pass http://simplify_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        proxy_pass http://simplify_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # `^~` stops the static-asset regex below from hijacking /api/logos/*.png.
    location ^~ /api/ {
        proxy_pass http://simplify_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Excel uploads + AI calls can take a while.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # NB: nginx does not inherit `add_header` into a location that declares
    # its own add_header, so the security headers are repeated below.

    # ── Hashed build assets: cache forever ────────────────────────────────
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|avif|ico|map)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # ── index.html: never cache (it references hashed bundles) ────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ── Angular client-side routing ───────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hide dotfiles.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
