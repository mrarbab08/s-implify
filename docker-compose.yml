# S-Implify production stack — nginx (Angular bundle + /api proxy) + API.
#
# This is the default compose file, so on the VPS you can simply run:
#   cp .env.example .env
#   docker compose up -d --build
#
# The app is served on ${WEB_PORT:-80}. Put TLS in front of it with the host
# nginx/certbot, Caddy, or Cloudflare (see deploy/README.md).
# NOTE: keep in sync with docker-compose.prod.yml (compatibility alias).
name: s-implify

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: s-implify-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 8080
      SIMPLIFY_DB_PATH: /app/data/simplify.db
      LOG_REQUESTS: ${LOG_REQUESTS:-0}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEBUG_AI: ${DEBUG_AI:-0}
    volumes:
      # SQLite DB, uploads and district logos — the only stateful data.
      - ./backend/data:/app/data
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./S-implify-web-prod
      dockerfile: Dockerfile
    container_name: s-implify-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # No host `ports:` binding: Coolify's proxy routes to container port 80.
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
